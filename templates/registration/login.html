{% extends "base.html" %}
{% block title %}Login — ExportMall{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Login</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary btn-block">Login</button>
  </form>
  <p class="muted">No account? <a href="{% url 'accounts:register' %}">Register</a></p>
</div>
{% endblock %}
